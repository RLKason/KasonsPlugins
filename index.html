<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kasons Plugins</title>
  <meta name="description" content="Kasons Plugins — Best Rocket League Exploits Ever!!!" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <style>
    :root{
      --bg:#0b1020; --card:#0f1724; --muted:#9aa4b2; --accent:#7c5cff; --glass: rgba(255,255,255,0.03);
      --radius:14px; --maxw:1100px; --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:linear-gradient(180deg,#05060a 0%, #071025 60%); color:#e6eef8; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      padding:32px 20px;
      display:flex; align-items:flex-start; justify-content:center;
    }
    .site{max-width:var(--maxw); width:100%;}
    header{display:flex; gap:16px; align-items:center; justify-content:space-between; margin-bottom:28px}
    .brand{display:flex; gap:12px; align-items:center}
    .logo{width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:linear-gradient(135deg,var(--accent),#3aa0ff); box-shadow:0 6px 18px rgba(124,92,255,0.18); font-weight:700}
    .brand h1{font-size:20px;margin:0}
    .brand p{margin:0;color:var(--muted); font-size:13px}

    nav{display:flex; gap:10px; align-items:center}
    .btn{background:var(--glass); padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); cursor:pointer; font-weight:600}
    .btn.ghost{background:transparent}

    .hero{display:grid; grid-template-columns:1fr 360px; gap:20px; margin-bottom:28px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:var(--radius); padding:20px; border:1px solid rgba(255,255,255,0.03)}
    .lead{font-size:14px; color:var(--muted); margin-top:8px}

    .search{display:flex; gap:12px; align-items:center}
    input[type=text]{flex:1; padding:12px 14px; border-radius:10px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:inherit}

    .sidebar .stats{display:flex; gap:12px; margin-top:12px}
    .stat{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent); padding:10px; border-radius:10px; text-align:center}
    .stat strong{display:block;font-size:18px}
    .plugins-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
    .plugin{display:flex; gap:12px; align-items:flex-start}
    .plugin .icon{width:64px; height:64px; border-radius:10px; background:linear-gradient(135deg,#1f2937,#111827); display:flex; align-items:center; justify-content:center; font-weight:700}
    .plugin h3{margin:0 0 6px 0}
    .meta{color:var(--muted); font-size:13px}
    .plugin .actions{margin-left:auto; display:flex; gap:8px}
    .pill{padding:6px 10px; border-radius:999px; font-weight:700; font-size:12px}
    .pill.download{background:linear-gradient(90deg,var(--accent),#3aa0ff); color:white}
    .pill.docs{background:transparent; border:1px solid rgba(255,255,255,0.04)}

    footer{margin-top:28px; text-align:center; color:var(--muted); font-size:13px}

    @media (max-width:900px){
      .hero{grid-template-columns:1fr}
      .plugins-grid{grid-template-columns:1fr}
    }

    /* small components */
    .tag{display:inline-block; padding:6px 8px; background:rgba(255,255,255,0.02); border-radius:8px; font-size:12px; color:var(--muted)}
    .accordion{margin-top:12px}
    .acc-item{border-radius:10px; padding:10px; border:1px solid rgba(255,255,255,0.03); margin-bottom:8px}
    summary{cursor:pointer; font-weight:700}

    .badge{background:rgba(255,255,255,0.03); padding:6px 8px; border-radius:8px; font-size:12px}
  </style>
</head>
<body>
  <div class="site">

    <header>
      <div class="brand">
        <div class="logo">KP</div>
        <div>
          <h1>Kasons Plugins</h1>
          <p>Kasons Plugins — Best Rocket League Exploits Ever!!!</p>
        </div>
      </div>
      <nav>
        <div class="search card" style="display:flex; align-items:center;">
          <input id="search" type="text" placeholder="Search plugins, tags, author..." />
          <button class="btn" id="searchBtn">Search</button>
        </div>
        <button class="btn" id="uploadBtn">Upload</button>
        <button class="btn ghost" id="themeBtn">Toggle Theme</button>
      </nav>
    </header>

    

    <section class="card">
      <h2>Plugins Coming Soon ;)</h2>
      <p class="lead">Browse the full list or filter by tag/author.</p>
      <div id="allPlugins" style="margin-top:12px" class="plugins-grid">
        <!-- populated by JS -->
      </div>
    </section>

    <footer>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; max-width:var(--maxw); margin:18px auto 0">
        <div>© <strong>Kasons Plugins</strong> — Not affiliated with Psyonix or BakkesMod.</div>
        <div style="color:var(--muted)">Please share our website, These hacks dont make themselves.</div>
      </div>
    </footer>

  </div>

  <script>
    // Plugins removed — placeholder message
    document.addEventListener('DOMContentLoaded', ()=>{
      const featuredEl = document.getElementById('featured');
      const allEl = document.getElementById('allPlugins');
      const coming = `
        <div style="grid-column:1/-1; display:flex; align-items:center; justify-content:center; padding:28px;">
          <div style="text-align:center; max-width:720px;">
            <h2 style="font-size:22px; margin:0 0 8px">Plugins Coming Soon ;)</h2>
            <p style="margin:0; color:var(--muted)">We're working on adding plugins. Check back later or join our Discord for updates.</p>
          </div>
        </div>
      `;
      featuredEl.innerHTML = coming;
      allEl.innerHTML = coming;

      // update counts
      document.getElementById('pluginsCount').textContent = '0';
      document.getElementById('downloadsCount').textContent = '0';

      // disable search/upload actions (placeholders)
      const searchBtn = document.getElementById('searchBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      if(searchBtn) searchBtn.addEventListener('click', ()=>{ document.getElementById('allPlugins').innerHTML = coming; });
      if(uploadBtn) uploadBtn.addEventListener('click', ()=> alert('Upload is not yet available.'));
    });
  </script>
</body>
</html>
